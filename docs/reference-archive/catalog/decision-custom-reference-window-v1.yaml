freeze_state: pre_test_truth_locked
mutable: false
question: >-
  Does frozen calibrated late fusion improve detection quality or operational
  trade-offs over either custom modality on the same held-out synchronized
  PTFP-Custom-v1 runs?
scope:
  experiment: PTFP-Custom-v1 paired campaign
  component: ExperimentSpec.v1 command schedule and CDS 803 Terminal 53 profile
  evidence_tracks: PTFP-Custom-v1 physical; PTFP-Custom-v1 syscall; custom fusion
  final_outputs: custom dataset manifest; physical result table; syscall result table; paired custom ablation; capability/limitation matrix; claim index
values:
  reference_window:
    field: speed_reference_pct
    minimum: 25
    maximum: 75
    unit: percent
    classification: preregistered_factor
  command_profile:
    profile_id: instrument-profile-cds803-terminal53-linear-0-100-v1
    parameter_6_12_low_current_ma: 4
    parameter_6_13_high_current_ma: 20
    parameter_6_14_low_reference_pct: 0
    parameter_6_15_high_reference_pct: 100
rationale: >-
  Freeze two bounded and interpretable submaximal reference factors before any
  formal test so the same commanded transitions can support synchronized
  physical, syscall, and fusion evaluation. The choice is an experimental
  factor, not a claim about power, efficiency, safety, or a universal
  compressor operating range.
source_constraints:
  - source_id: vendor-danfoss-cds803-programming-2021
    locator: printed p. 54, Tables 60-63, parameters 6-12 through 6-15
    role: proves Terminal 53 current/reference configurability and 4/20 mA defaults only
  - source_id: vendor-doe-compressed-air-sourcebook
    locator: section 5 and Figure 2.8
    role: qualitative design-dependence constraint only; no numeric value authority
prohibited_interpretations:
  - manufacturer-recommended 25%-75% range
  - electrical-power percentage
  - compressor safety or efficiency limit
  - real-plant operating envelope
authorization_boundary: >-
  This record freezes planning values only. It does not authorize implementation,
  experiment execution, syscall capture, training, activation, or publication.
